<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="essaludBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066CA" />
      <stop offset="100%" stop-color="#005CA9" />
    </linearGradient>
  </defs>

  <!-- Isotipo EsSalud (Cruz / Figura Humana Asistencial con Hoja Verde) -->
  <g transform="translate(10, 8)">
    <!-- Círculo Cabeza / Sol Asistencial -->
    <circle cx="32" cy="14" r="9" fill="#005CA9" />
    
    <!-- Brazos Protectores / Arco Azul EsSalud -->
    <path d="M12 36 C12 24, 52 24, 52 36 C52 46, 44 54, 32 58 C20 54, 12 46, 12 36 Z" fill="url(#essaludBlueGrad)" />
    
    <!-- Hojita / Acento Verde Institucional EsSalud -->
    <path d="M38 10 C46 6, 54 12, 52 22 C44 24, 36 18, 38 10 Z" fill="#009B3A" />
    
    <!-- Cruz Blanca Interior de Salud -->
    <path d="M29 32 L35 32 L35 48 L29 48 Z" fill="#FFFFFF" />
    <path d="M24 37 L40 37 L40 43 L24 43 Z" fill="#FFFFFF" />
  </g>

  <!-- Tipografía Oficial EsSalud -->
  <g transform="translate(78, 12)">
    <!-- Texto "EsSalud" -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="#005CA9" letter-spacing="-1">
      Es<tspan fill="#003876">Salud</tspan>
    </text>
    
    <!-- Subtítulo "Seguro Social de Salud" -->
    <text x="2" y="52" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#009B3A" letter-spacing="1.5">
      SEGURO SOCIAL DE SALUD
    </text>
  </g>
</svg>
